<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png?v=1.10.0" sizes="192x192">
  <link rel="stylesheet" href="style.css?v=1.10.0">
  <link rel="stylesheet" href="decision-experience.css?v=1.10.0">
  <title>日本株 CHECK</title>
</head>
<body>
  <header>
    <div class="brand"><strong>日本株 CHECK</strong><small>v1.10.0</small></div>
    <div id="meta">読み込み中</div>
  </header>

  <main>
    <section id="decision-view" class="view">
      <section id="banner"></section>
      <section id="common-overview"></section>
      <section id="today-overview"></section>
    </section>

    <section id="stocks-view" class="view" hidden>
      <div class="tab-intro"><span>銘柄</span><b>必要な銘柄だけ詳しく確認</b><small>個別方針・次条件・チャート・EDINETを確認します。</small></div>
      <section id="cards"></section>
    </section>

    <section id="forecast-view" class="view" hidden>
      <div class="tab-intro"><span>予測</span><b>6銘柄の方向を横並びで比較</b><small>1・3・5・14営業日の参考分析と市場環境を確認します。</small></div>
      <section id="portfolio-forecast"></section>
      <section id="forecast-detail-list"></section>
      <section id="market-environment"></section>
    </section>

    <section id="quality-view" class="view" hidden>
      <div class="tab-intro"><span>品質</span><b>判断に使う前のデータ健全性</b><small>独立Source照合・要確認理由・再調査をここへ集約します。</small></div>
      <section id="quality-digest"></section>
      <section id="data-quality"></section>
    </section>

    <section id="manage-view" class="view" hidden>
      <div class="tab-intro"><span>管理</span><b>更新・診断・運用状況</b><small>通常判断ではなく、保守や詳しい説明が必要なときに確認します。</small></div>
      <section id="manage-updates"></section>
      <section id="help"></section>
    </section>
  </main>

  <nav class="primary-nav" aria-label="メインメニュー">
    <button type="button" class="active" data-view="decision-view" aria-current="page">判断</button>
    <button type="button" data-view="stocks-view">銘柄</button>
    <button type="button" data-view="forecast-view">予測</button>
    <button type="button" data-view="quality-view">品質</button>
    <button type="button" data-view="manage-view">管理</button>
  </nav>

  <script src="deep-dive-bundle.js?v=1.10.0"></script>
  <script src="review-history.js?v=1.10.0"></script>
  <script src="decision-experience.js?v=1.10.0"></script>
  <script src="app.js?v=1.10.0"></script>
  <script>JPDecisionExperience.install(window);</script>
</body>
</html>
