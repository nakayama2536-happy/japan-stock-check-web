<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png?v=1.5.0" sizes="192x192">
  <link rel="stylesheet" href="style.css?v=1.5.0">

</head>
<body>

    <div class="brand"><strong>日本株 CHECK</strong><small>v1.5.0</small></div>

  <main>
    <section id="home-view" class="view">
      <section id="banner"></section>
      <section id="common-overview"></section>
      <section id="today-overview"></section>

    <section id="help-view" class="view" hidden>
      <section id="help"></section>

  <nav aria-label="メインメニュー">
    <button type="button" class="active" data-view="home-view">ホーム</button>
    <button type="button" data-view="help-view">解説</button>

  <script src="app.js?v=1.5.0"></script>
