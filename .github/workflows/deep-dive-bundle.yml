name: Deep Dive Bundle Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/deep-dive-bundle.js'
      - 'docs/app.js'
      - 'docs/index.html'
      - 'docs/manifest.webmanifest'
      - 'docs/sw.js'
      - 'tests/deep-dive-bundle.test.cjs'
      - '.github/workflows/deep-dive-bundle.yml'
  push:
    branches: [main]
    paths:
      - 'docs/deep-dive-bundle.js'
      - 'docs/app.js'
      - 'docs/index.html'
      - 'docs/manifest.webmanifest'
      - 'docs/sw.js'
      - 'tests/deep-dive-bundle.test.cjs'
      - '.github/workflows/deep-dive-bundle.yml'

permissions:
  contents: read

jobs:
  deep-dive-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Check bundle loader syntax
        run: node --check docs/deep-dive-bundle.js
      - name: Execute bundle integrity tests
        run: node --test tests/deep-dive-bundle.test.cjs
