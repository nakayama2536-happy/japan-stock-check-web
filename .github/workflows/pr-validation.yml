name: PR Validation

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check docs/app.js
      - name: Validate Common fallback and UI version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          index=Path("docs/index.html").read_text(encoding="utf-8")
          app=Path("docs/app.js").read_text(encoding="utf-8")
          sw=Path("docs/sw.js").read_text(encoding="utf-8")
          manifest=json.loads(Path("docs/manifest.webmanifest").read_text(encoding="utf-8"))
          import re
          m=re.search(r'<small>v([0-9]+\.[0-9]+\.[0-9]+)</small>',index)
          assert m, "UI version badge missing"
          version=m.group(1)
          assert f"v={version}" in index
          assert f"v={version}" in manifest["start_url"]
          assert "jpstock-v"+version.replace(".","-") in sw
          assert 'id="common-overview"' in index
          assert 'function renderCommonOverview(c)' in app
          assert 'data/common_snapshot.json' in app
          assert 'chart28Svg' in app and '市場環境の28日グラフを見る' in app
          assert 'supplement-details' in app and '市場環境の見方' in app
          assert '.catch(()=>null)' in app
          assert 'function formalDecisionText(d,s)' in app
          assert 'function stockChartSvg(doc,sec)' in app
          assert '最新状態を確認' in app
          assert '市場データ更新' in app
          assert '予測の詳細を見る' in app
          assert 'diagnose-quality.yml' in app
          assert '直近1か月' in app
          assert 'tech-compact-grid' in app
          assert 'LAST_VALID:"直近有効値"' in app
          assert 'qualityResultMessage' in app
          assert 'overview-price' in app
          assert 'stock-accordion' in app
          assert 'forecast-grid' in app
          assert 'conditionGapText' in app
          assert '品質要確認' in app
          assert 'function macdSeries(rows)' in app
          assert 'function rsiSeries(rows,period=14)' in app
          assert '株価・MACD・RSIを見る' in app
          assert 'next_recheck_at' in app
          assert 'banner-status-strip' in app
          assert 'なし（検証中）' in app
          assert 'SHADOW_PARTIAL:"検証結果保存済み・要確認"' in app
          assert 'LOW_MISMATCH:"安値データ差異あり"' in app
          assert 'Pre-deploy public safety gate' in Path(".github/workflows/deploy-pages.yml").read_text(encoding="utf-8")
          print("Japan P0 hardening validation PASS")
          PY
