name: PR Validation

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check docs/app.js
      - name: Validate Common fallback and UI version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          index=Path("docs/index.html").read_text(encoding="utf-8")
          app=Path("docs/app.js").read_text(encoding="utf-8")
          sw=Path("docs/sw.js").read_text(encoding="utf-8")
          manifest=json.loads(Path("docs/manifest.webmanifest").read_text(encoding="utf-8"))
          assert "v1.4.6" in index
          assert "v=1.4.6" in index
          assert "v=1.4.6" in manifest["start_url"]
          assert "jpstock-v1-4-6" in sw
          assert 'id="common-overview"' in index
          assert 'function renderCommonOverview(c)' in app
          assert 'fetch("data/common_snapshot.json"' in app
          assert '.catch(()=>null)' in app
          assert 'function formalDecisionText(d,s)' in app
          assert 'なし（Shadow検証中）' in app
          assert 'SHADOW_PARTIAL:"検証結果保存済み・要確認"' in app
          assert 'LOW_MISMATCH:"安値データ差異あり"' in app
          assert 'Pre-deploy public safety gate' in Path(".github/workflows/deploy-pages.yml").read_text(encoding="utf-8")
          print("Japan P0 hardening validation PASS")
          PY
